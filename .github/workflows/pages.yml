name: Publish examples and documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build browser examples and documentation
        run: nix run .#web-build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages-site-${{ github.run_id }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
