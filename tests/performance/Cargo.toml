[package]
name = "acoustic-performance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
sampling = ["dep:pprof"]

[lib]
crate-type = ["rlib", "cdylib"]
bench = false

[[bin]]
name = "acoustic-performance"
path = "src/main.rs"
bench = false
test = false

[[bin]]
name = "cache-statistics"
path = "src/cache_statistics.rs"
bench = false
test = false

[[bench]]
name = "workloads"
harness = false

[[bin]]
name = "cache-paired"
path = "src/cache_paired.rs"
bench = false
test = false

[[bench]]
name = "cache_behavior"
harness = false

[dependencies]
bevy-raytraced-audio = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.15", optional = true, default-features = false, features = ["flamegraph"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[lints]
workspace = true
