[package]
name = "bevy-raytraced-audio-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Bevy 3D acoustic propagation and built-in sink attenuation"

[features]
default = ["bevy_0_19"]
bevy_0_17 = ["dep:compat_0_17"]
bevy_0_18 = ["dep:compat_0_18"]
bevy_0_19 = ["dep:compat_0_19"]
bevy_0_20 = ["dep:compat_0_20"]
# Animated gizmo drawing of recorded listener rays.
debug_draw = [
  "compat_0_17?/debug_draw",
  "compat_0_18?/debug_draw",
  "compat_0_19?/debug_draw",
  "compat_0_20?/debug_draw",
]

[dependencies]
compat_0_17 = { package = "bevy-raytraced-audio-compat-0-17", path = "../bevy-raytraced-audio-compat-0-17", version = "0.1.0", optional = true }
compat_0_18 = { package = "bevy-raytraced-audio-compat-0-18", path = "../bevy-raytraced-audio-compat-0-18", version = "0.1.0", optional = true }
compat_0_19 = { package = "bevy-raytraced-audio-compat-0-19", path = "../bevy-raytraced-audio-compat-0-19", version = "0.1.0", optional = true }
compat_0_20 = { package = "bevy-raytraced-audio-compat-0-20", path = "../bevy-raytraced-audio-compat-0-20", version = "0.1.0", optional = true }

[lints]
workspace = true
