[package]
name = "bevy-raytraced-audio-compat-0-19"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bevy 0.19 compatibility implementation for ray-traced audio adapters"

[features]
debug_draw = ["bevy/bevy_color", "bevy/bevy_gizmos"]
renderer = ["bevy/bevy_render"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_audio"] }
bevy-raytraced-audio = { path = "../..", version = "0.1.0" }
bevy_ecs = "0.19.1"
log = "0.4"

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["wav"] }
rodio = { version = "0.22", default-features = false }

[lints]
workspace = true
