<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Move a listener through a forest sound scene and compare direct and reflected acoustic paths." />
    <title>Forest sound paths · Bevy Raytraced Audio</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="stylesheet" href="../../site.css" />
  </head>
  <body class="demo-embed">
    <main class="demo-main embed-main">
      <div class="demo-heading">
        <h1>Forest sound paths</h1>
        <span class="demo-label">3D · Bevy · CPU tracing</span>
      </div>
      <section class="demo-frame" aria-label="Interactive forest acoustic audio demonstration">
        <div class="demo-toolbar">
          <button class="start-button" id="start-demo" type="button" disabled>Loading scene…</button>
          <p class="demo-status" id="demo-status" role="status" aria-live="polite">Loading the Bevy scene and checking browser audio.</p>
        </div>
        <div class="canvas-wrap">
          <canvas id="bevy-canvas" aria-label="Low-poly forest with a stone arch, walking listener, moving chime, and direct and reflected acoustic paths" tabindex="0"></canvas>
          <p class="canvas-state" id="canvas-state" role="status" aria-live="polite">Loading the Bevy renderer…</p>
        </div>
      </section>
    </main>
    <script type="module" src="../../web-demo.js"></script>
  </body>
</html>
