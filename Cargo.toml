[package]
name = "bevy-raytraced-audio"
version.workspace = true
autobenches = false
autobins = false
autoexamples = false
autotests = false
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "CPU ray-traced acoustic propagation for Bevy projects"

[lib]
bench = false

[[test]]
name = "core_public_api"
path = "tests/core_public_api.rs"

[[example]]
name = "trace_2d"
path = "examples/trace_2d.rs"

[[bench]]
name = "propagation"
path = "benches/propagation.rs"
harness = false

[dependencies]

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

[workspace]
members = [
  "crates/bevy-raytraced-audio-2d",
  "crates/bevy-raytraced-audio-3d",
  "crates/bevy-raytraced-audio-compat-0-17",
  "crates/bevy-raytraced-audio-compat-0-18",
  "crates/bevy-raytraced-audio-compat-0-19",
  "crates/bevy-raytraced-audio-compat-0-20",
  "examples/raytraced-audio",
  "tests/bevy-adapters",
]
default-members = ["."]
exclude = ["vendor/rodio"]
resolver = "3"

[patch.crates-io]
# Backport the upstream stereo-panning fix without changing the audio stack.
rodio = { path = "vendor/rodio" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sagan-software/bevy-raytraced-audio"
rust-version = "1.96.1"

[workspace.dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

# https://doc.rust-lang.org/rustc/lints/listing/index.html
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
# NOTE: Set to "allow" because this lint produces noisy warnings on macOS
# ("ignoring duplicate libraries", "built for newer macOS version", etc.)
# that are harmless. The Rust team is working on splitting this lint into
# linker-info (allow) and linker-messages (warn). See:
# https://github.com/rust-lang/rust/issues/136096
linker_messages = "allow"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = { level = "forbid", priority = 1 }
missing_unsafe_on_extern = "warn"
# multiple-supertrait-upcastable = "warn"
# must-not-suspend = "warn"
non_ascii_idents = "warn"
# non-exhaustive-omitted-patterns = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
single_use_lifetimes = "warn"
# supertrait-item-shadowing-definition = "warn"
# supertrait-item-shadowing-usage = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unknown_lints = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", 'cfg(dylint_lib, values("correctness", "perf", "suspicious"))'] }
unnameable_types = "warn"
# unqualified-local-imports = "warn"
unreachable_pub = { level = "warn", priority = 1 }
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_crate_dependencies = "allow"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "allow"
variant_size_differences = "warn"

# https://doc.rust-lang.org/rustdoc/lints.html
[workspace.lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

# https://rust-lang.github.io/rust-clippy/master/index.html
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
indexing_slicing = { level = "warn", priority = 2 }
cargo = { level = "warn", priority = -1 }
# Allow multiple versions of transitive dependencies (out of our control)
multiple_crate_versions = { level = "allow", priority = 1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
nursery = { level = "warn", priority = -1 }
# Noisy nursery lints - allow until they are more stable
missing_const_for_fn = { level = "warn", priority = 1 }
# future_not_send conflicts with valid async patterns using references
future_not_send = { level = "allow", priority = 1 }
# significant_drop_tightening has false positives and is overly pedantic
significant_drop_tightening = { level = "allow", priority = 1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_pub_crate = { level = "allow", priority = 1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
cargo_common_metadata = { level = "allow", priority = 1 }
option_if_let_else = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_docs_in_private_items = { level = "forbid", priority = 2 }
missing_panics_doc = "warn"
cast_precision_loss = { level = "warn", priority = 1 }
struct_field_names = { level = "warn", priority = 1 }
must_use_candidate = "warn"
if_not_else = { level = "warn", priority = 1 }
collapsible_if = { level = "warn", priority = 1 }
match_same_arms = { level = "warn", priority = 1 }
redundant_closure_for_method_calls = { level = "warn", priority = 1 }
let_and_return = { level = "warn", priority = 1 }
struct_excessive_bools = { level = "warn", priority = 1 }
missing_fields_in_debug = { level = "warn", priority = 1 }
use_self = { level = "warn", priority = 1 }
unused_self = { level = "warn", priority = 1 }
unnecessary_wraps = { level = "warn", priority = 1 }

[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/sagan-software/dylints", branch = "main", pattern = ["lints/correctness", "lints/perf", "lints/suspicious"] },
]
